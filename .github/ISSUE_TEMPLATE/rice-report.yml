name: Rice compatibility report
description: Submit a report that you reviewed locally in Alchemy
title: "[Rice report] "
labels: ["rice-report"]
body:
  - type: markdown
    attributes:
      value: |
        Alchemy does not send reports automatically. Remove any information you do not want public.
  - type: textarea
    id: report
    attributes:
      label: Reviewed report
      description: Paste or retain the prefilled JSON generated by `alchemy gallery-report`.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public submission
      options:
        - label: I reviewed this report and understand that the GitHub issue will be public.
          required: true
