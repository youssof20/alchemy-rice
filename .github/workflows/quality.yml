name: Quality and packaging

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-distributions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and build tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-output.txt
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            output="$(tail -c 6000 pytest-output.txt)"
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            echo "::error title=Unit tests failed::${output}"
            exit "$test_status"
          fi
      - name: Validate pending release ledger
        run: python -m alchemy.cli.main release-check release/evidence-v1.json
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Record artifact hashes in the job log
        run: sha256sum dist/*
