[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy-rice"
version = "0.1.0a1"
description = "Transactional KDE Plasma 6 ricing workbench (early development)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Alchemy contributors" }]
keywords = ["KDE", "Plasma", "desktop", "configuration", "ricing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]
dependencies = [
  "PySide6>=6.7,<7",
  "qasync>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/youssof20/alchemy-rice"
Repository = "https://github.com/youssof20/alchemy-rice"
Issues = "https://github.com/youssof20/alchemy-rice/issues"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "twine>=6,<7",
]

[project.scripts]
alchemy = "alchemy.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/alchemy/compatibility" = [
  "compatibility/plasma.json",
  "compatibility/components.json",
  "compatibility/distro-packages.json",
]
"share/applications" = ["packaging/io.github.youssof20.Alchemy.desktop"]
"share/metainfo" = ["packaging/io.github.youssof20.Alchemy.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["packaging/io.github.youssof20.Alchemy.svg"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["alchemy"]
